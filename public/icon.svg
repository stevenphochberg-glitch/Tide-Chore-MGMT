<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tide-ocean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e3a47" />
      <stop offset="45%" stop-color="#145357" />
      <stop offset="100%" stop-color="#2a1b4e" />
    </linearGradient>
    <linearGradient id="tide-scales" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="tide-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#tide-ocean)" />

  <!-- Outer Art Nouveau organic circular frame -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#tide-scales)" stroke-width="3.5" opacity="0.6" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#tide-scales)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Stylized Art Nouveau mermaid curve / ocean crest -->
  <g transform="translate(256, 266)">
    <!-- Swirling ocean tide & mermaid tail form -->
    <path d="M -30,-140 C 40,-130 90,-70 70,20 C 56,80 -10,120 -40,150 C -75,120 -80,60 -60,0 C -45,-45 -50,-100 -30,-140 Z" fill="url(#tide-scales)" opacity="0.85" />
    
    <!-- Tail flukes -->
    <path d="M -40,140 C -80,130 -130,170 -110,210 C -70,200 -50,170 -35,150 C -20,170 0,200 40,210 C 60,170 10,130 -30,140 Z" fill="url(#tide-scales)" />

    <!-- Wave crest curl -->
    <path d="M -120,-40 C -80,-120 40,-140 100,-80 C 140,-40 130,40 70,80 C 30,100 -10,80 -20,50 C -30,20 0,0 20,10 C 35,20 30,40 15,40" fill="none" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round" />

    <!-- Scale accents -->
    <circle cx="-10" cy="40" r="14" fill="none" stroke="#f472b6" stroke-width="3" opacity="0.8" />
    <circle cx="15" cy="65" r="14" fill="none" stroke="#c084fc" stroke-width="3" opacity="0.8" />
    <circle cx="-25" cy="85" r="12" fill="none" stroke="#2dd4bf" stroke-width="3" opacity="0.8" />
    <circle cx="0" cy="110" r="12" fill="none" stroke="#fbcfe8" stroke-width="3" opacity="0.8" />

    <!-- Star / Pearl accent -->
    <circle cx="-30" cy="-140" r="7" fill="#fef08a" />
    <circle cx="100" cy="-80" r="5" fill="#fbcfe8" />
  </g>
</svg>
